{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Unavailable — Order Karle</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/storefront.css' %}">
</head>
<body>
<div class="store-inactive-page">
  <div class="store-inactive-card">
    <div class="store-inactive-icon"><i class="ri-lock-line"></i></div>
    {% if seller %}
    <h1 class="store-inactive-title">{{ seller.business_name }}</h1>
    {% else %}
    <h1 class="store-inactive-title">Store Not Found</h1>
    {% endif %}
    <p class="store-inactive-body">{{ message }}</p>
    <a href="/" class="btn btn-ghost">← Back to Order Karle</a>
  </div>
</div>
</body>
</html>
