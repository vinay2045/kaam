{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error — Kaam</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <style>
    .error-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--kaam-paper); padding:24px; }
    .error-card { text-align:center; max-width:440px;background:var(--kaam-milk);border:2px solid var(--kaam-stone);border-radius:28px;padding:48px 36px;box-shadow:0 6px 24px rgba(22,17,15,0.1); }
    .error-code { font-family:var(--font-mono);font-size:72px;font-weight:600;color:var(--kaam-clay);line-height:1;margin-bottom:4px; }
    .error-title { font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--kaam-ink);margin-bottom:12px; }
    .error-body { font-size:14px;color:var(--kaam-stone-dark);margin-bottom:28px; }
  </style>
</head>
<body>
<div class="error-page">
  <div class="error-card">
    <div class="error-code">500</div>
    <h1 class="error-title">Something Went Wrong</h1>
    <p class="error-body">We hit an unexpected error. Our team has been notified. Please try again in a moment.</p>
    <a href="/" class="btn btn-primary">← Back to Kaam</a>
  </div>
</div>
</body>
</html>
